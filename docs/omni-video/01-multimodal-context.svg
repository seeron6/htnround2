<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="One moment. Three sources of context."><defs><marker id="limeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#cefa72"/></marker><marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#70dfed"/></marker></defs><rect width="1920" height="1080" fill="#0b1218"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="76" font-size="24" fill="#cefa72" letter-spacing="3">PUNCHING FACE  /  OMNI LIVE</text><text x="100" y="169" font-size="62" fill="#f5f4ec" font-weight="700">One moment. Three sources of context.</text><text x="100" y="228" font-size="30" fill="#b2c2c9" >The response is grounded in the player, the room and the game.</text>
