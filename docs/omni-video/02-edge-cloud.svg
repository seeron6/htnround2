<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Fast interaction here. Context in the cloud."><defs><marker id="limeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#cefa72"/></marker><marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#70dfed"/></marker></defs><rect width="1920" height="1080" fill="#0b1218"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="76" font-size="24" fill="#cefa72" letter-spacing="3">PUNCHING FACE  /  OMNI LIVE</text><text x="100" y="169" font-size="62" fill="#f5f4ec" font-weight="700">Fast interaction here. Context in the cloud.</text><text x="100" y="228" font-size="30" fill="#b2c2c9" >A laptop-based game connected to Qwen3.5-Omni.</text>
<g id="request-label"><text x="960" y="293" font-size="25" fill="#cefa72" text-anchor="middle" letter-spacing="1">SHORT VIDEO  +  RELEVANT AUDIO  +  GAME CONTEXT</text></g>
<g id="laptop"><rect x="100" y="330" width="580" height="430" rx="24" fill="#13212b"/><text x="140" y="398" font-size="27" fill="#cefa72" letter-spacing="2">THE LAPTOP</text><text x="140" y="467" font-size="36" fill="#f5f4ec" font-weight="700">Track the movement</text><text x="140" y="525" font-size="34" fill="#f5f4ec" >Detect virtual contact</text><text x="140" y="583" font-size="34" fill="#f5f4ec" >Animate the head</text><text x="140" y="657" font-size="29" fill="#b2c2c9" >Local reaction + grunt</text><text x="140" y="709" font-size="29" fill="#b2c2c9" >Camera and audio controls</text></g>
<g id="relay"><rect x="790" y="405" width="340" height="280" rx="24" fill="#13212b"/><text x="960" y="465" font-size="24" fill="#cefa72" text-anchor="middle" letter-spacing="1">LOCAL SERVER</text><text x="960" y="531" font-size="29" fill="#f5f4ec" text-anchor="middle">Connects the game</text><text x="960" y="576" font-size="29" fill="#f5f4ec" text-anchor="middle">to OMNI</text><text x="960" y="638" font-size="24" fill="#b2c2c9" text-anchor="middle">API key stays here</text></g>
<g id="cloud"><rect x="1240" y="330" width="580" height="430" rx="24" fill="#13212b"/><text x="1280" y="398" font-size="27" fill="#70dfed" letter-spacing="2">OMNI IN THE CLOUD</text><text x="1280" y="468" font-size="38" fill="#f5f4ec" font-weight="700">Shared context</text><text x="1280" y="526" font-size="29" fill="#b2c2c9" >Video + audio + language</text><text x="1280" y="606" font-size="32" fill="#f5f4ec" >Streamed spoken reply</text><text x="1280" y="668" font-size="32" fill="#f5f4ec" >Parallel expression call</text><text x="1280" y="719" font-size="24" fill="#70dfed" >qwen3.5-omni-flash</text></g>
<g id="request-path"><path d="M 697 545 L 770 545" fill="none" stroke="#cefa72" stroke-width="4" marker-end="url(#limeArrow)"/><path d="M 1147 545 L 1220 545" fill="none" stroke="#cefa72" stroke-width="4" marker-end="url(#limeArrow)"/></g>
<g id="return-path"><path d="M 1530 785 L 1530 895 L 390 895 L 390 785" fill="none" stroke="#70dfed" stroke-width="4" marker-end="url(#cyanArrow)"/><text x="960" y="865" font-size="26" fill="#70dfed" text-anchor="middle" letter-spacing="1">STREAMED SPEECH + EXPRESSION CHOICE</text><text x="960" y="965" font-size="30" fill="#f5f4ec" text-anchor="middle">The audio drives the mouth. OMNI confirms or corrects the look.</text></g></g></svg>