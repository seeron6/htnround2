<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="A reaction now. A response with context."><defs><marker id="limeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#cefa72"/></marker><marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#70dfed"/></marker></defs><rect width="1920" height="1080" fill="#0b1218"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="76" font-size="24" fill="#cefa72" letter-spacing="3">PUNCHING FACE  /  OMNI LIVE</text><text x="100" y="169" font-size="62" fill="#f5f4ec" font-weight="700">A reaction now. A response with context.</text><text x="100" y="228" font-size="30" fill="#b2c2c9" >Two layers of feedback keep the character responsive.</text>
<g id="local-reaction"><rect x="100" y="315" width="1720" height="245" rx="24" fill="#13212b"/><text x="140" y="375" font-size="25" fill="#cefa72" letter-spacing="2">ON THE LAPTOP</text><text x="140" y="439" font-size="42" fill="#f5f4ec" font-weight="700">Immediate</text><text x="140" y="487" font-size="30" fill="#b2c2c9" >physical feedback</text><text x="710" y="417" font-size="36" fill="#f5f4ec" text-anchor="middle">Punch</text><text x="710" y="467" font-size="36" fill="#f5f4ec" text-anchor="middle">lands</text><path d="M 830 440 L 930 440" fill="none" stroke="#cefa72" stroke-width="4" marker-end="url(#limeArrow)"/><text x="1110" y="417" font-size="35" fill="#f5f4ec" text-anchor="middle">Head deforms</text><text x="1110" y="467" font-size="35" fill="#f5f4ec" text-anchor="middle">and reacts</text><path d="M 1300 440 L 1400 440" fill="none" stroke="#cefa72" stroke-width="4" marker-end="url(#limeArrow)"/><text x="1600" y="417" font-size="34" fill="#f5f4ec" text-anchor="middle">Cached grunt</text><text x="1600" y="467" font-size="30" fill="#f5f4ec" text-anchor="middle">+ initial expression</text></g>
<g id="omni-response"><rect x="100" y="605" width="1720" height="245" rx="24" fill="#13212b"/><text x="140" y="665" font-size="25" fill="#70dfed" letter-spacing="2">WITH OMNI</text><text x="140" y="729" font-size="42" fill="#f5f4ec" font-weight="700">Contextual</text><text x="140" y="777" font-size="30" fill="#b2c2c9" >conversation</text><text x="710" y="707" font-size="32" fill="#f5f4ec" text-anchor="middle">Clip + audio</text><text x="710" y="757" font-size="32" fill="#f5f4ec" text-anchor="middle">+ game context</text><path d="M 860 730 L 950 730" fill="none" stroke="#70dfed" stroke-width="4" marker-end="url(#cyanArrow)"/><text x="1110" y="707" font-size="34" fill="#f5f4ec" text-anchor="middle">OMNI reasons</text><text x="1110" y="757" font-size="32" fill="#f5f4ec" text-anchor="middle">over the moment</text><path d="M 1300 730 L 1400 730" fill="none" stroke="#70dfed" stroke-width="4" marker-end="url(#cyanArrow)"/><text x="1600" y="707" font-size="32" fill="#f5f4ec" text-anchor="middle">Streamed speech</text><text x="1600" y="757" font-size="29" fill="#f5f4ec" text-anchor="middle">+ expression choice</text></g>
<g id="handover"><text x="960" y="953" font-size="36" fill="#f5f4ec" text-anchor="middle">OMNI can confirm or change the initial expression.</text><text x="960" y="1014" font-size="24" fill="#b2c2c9" text-anchor="middle">Information flow — not a latency scale</text></g></g></svg>